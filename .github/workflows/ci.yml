name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # pwsh, the Windows default, splits -coverprofile=coverage.out at the dot.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Latest patched release rather than the go.mod minimum: the minimum
      # exists for compatibility, while CI should build with stdlib fixes.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go mod verify
      - run: go vet ./...
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # -race requires cgo; hosted runners ship a C toolchain on all three OSes.
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go test -count=10 ./internal/engine/

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/arm64, windows/amd64, windows/arm64, freebsd/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/sentinel
